name: Deploy to DockerHub

permissions: {}

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: matejkosiarcik/azlint

jobs:
  build-images:
    name: Build ${{ matrix.platform }} docker image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup QEMU
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/setup-qemu-action@v4.4.0
          with: |
            cache-image: false
          attempt_limit: 3
          attempt_delay: 2500

      - name: Setup Docker Buildx
        id: buildx
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/setup-buildx-action@v4.4.1
          attempt_limit: 3
          attempt_delay: 2500

      - name: Debug logs
        env:
          BUILDX_PLATFORMS: ${{ fromJSON(steps.buildx.outputs.outputs).platforms }}
        run: |
          printf 'Available platforms:\n%s\n' "${BUILDX_PLATFORMS}"

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Publish
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export platform
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: |
          escaped_docker_platform="$(printf '%s' "${DOCKER_PLATFORM}" | tr '/' '-')"
          printf 'DOCKER_PLATFORM=%s\n' "${escaped_docker_platform}" >> "${GITHUB_ENV}"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ env.DOCKER_PLATFORM }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  deploy-images:
    name: Merge and deploy docker images
    runs-on: ubuntu-latest
    needs:
      - build-images
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/setup-buildx-action@v4.4.1
          attempt_limit: 3
          attempt_delay: 2500

      - name: Docker metadata
        uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE }}
          # NOTE: ":latest" tag is added automatically on "type=semver"
          tags: |
            type=edge,branch=main
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Debug digests
        working-directory: /tmp/digests
        run: |
          printf 'Digests: %s\n' "$(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)"

      - name: Debug metadata
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          printf 'Version: %s\n' "${VERSION}"
          printf 'Tags raw: %s\n' "${TAGS}"
          printf 'Tags json: %s\n' "${DOCKER_METADATA_OUTPUT_JSON}"
          printf 'Tags parsed raw: %s\n' "$(printf '%s' "${TAGS}" | sed -E 's~^[ \n]+~~;s~[ \n]+$~~;s~[\n ]~ -t ~g;s~^~-t ~')"
          printf 'Tags parsed json: %s\n' "$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}")"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}"

  deploy-description:
    name: Update dockerhub description
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Update DockerHub description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: matejkosiarcik/azlint
          short-description: ${{ github.event.repository.description }}
