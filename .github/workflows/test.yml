name: Test

permissions: read-all

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup NodeJS
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/setup-node@v7.0.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            node-version: latest

      - name: Setup Python
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/setup-python@v5.4.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            python-version: 3.x

      - name: Setup Rust
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: hecrj/setup-rust-action@v2.0.1
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            rust-version: stable

      - name: Setup Go
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/setup-go@v5.3.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            go-version: stable

      - name: Setup Ruby
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: ruby/setup-ruby@v1.221.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            ruby-version: ruby # latest

      - name: Setup PHP
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: shivammathur/setup-php@2.32.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            php-version: latest
            extensions: mbstring # TODO: consider removing if not necessary

      - name: Setup GCC
        if: ${{ matrix.os == 'linux-latest' }}
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: egor-tensin/setup-gcc@v1.3
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            version: latest
            platform: x64

      # - name: Setup Clang
      #   if: ${{ matrix.os == 'linux-latest' }}
      #   uses: egor-tensin/setup-clang@v1.4
      #   with:
      #     version: latest
      #     platform: x64

      - name: Setup MinGW
        if: ${{ matrix.os == 'windows-latest' }}
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: egor-tensin/setup-mingw@v2.2.0
          attempt_limit: 3
          attempt_delay: 2500
          with: |
            version: "12.2.0"
            platform: x64

      - name: Setup Ninja
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: seanmiddleditch/gha-setup-ninja@v6
          attempt_limit: 3
          attempt_delay: 2500

      - name: Configure system
        run: |
          git config --global user.email nobody@example.com
          git config --global user.name Nobody
        shell: bash

      - name: Install project dependencies
        run: npm ci --unsafe-perm --no-progress --no-audit --no-fund --loglevel=error
        # TODO: Add system dependencies and run full bootstrap
        # run: make bootstrap
        shell: bash

      - name: Build
        run: make build
        shell: bash

      - name: Test
        run: make test
        shell: bash
